<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="stylesheet"
			type="text/css"
			href="style.css"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>수강신청 시스템</title>
	</head>
	<body>
		<!-- 수업 찾기 -->
		<div class="sidebar-left">
			<div class="search-container">
				<input
					type="text"
					class="search-bar"
					placeholder="과목 코드 또는 과목명을 입력하세요..."
				/>
			</div>

			<button class="filter-btn">
				<svg
					width="14"
					height="14"
					viewBox="0 0 24 24"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
				>
					<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
				</svg>
				고급 필터 (주간/야간, 학과별...)
			</button>

			<div class="course-list-title">검색 결과</div>

			<div class="course-list"></div>
		</div>

		<!-- 시간표 데모 -->
		<div class="main-content">
			<div class="main-header">
				<div class="main-title">시간표 데모</div>
				<div class="credit-summary">총 학점: <span id="total-credits">0</span> / 18</div>
			</div>

			<div
				class="timetable-container"
				id="timetable"
			>
				<!-- 요일 헤더 -->
				<div
					class="timetable-header"
					style="border-top-left-radius: 8px"
				>
					시간
				</div>
				<div class="timetable-header">월</div>
				<div class="timetable-header">화</div>
				<div class="timetable-header">수</div>
				<div class="timetable-header">목</div>
				<div
					class="timetable-header"
					style="border-top-right-radius: 8px"
				>
					금
				</div>

				<!-- 아래에서 JS로 시간표 행 생성 -->
			</div>
		</div>

		<!-- 대기 과목 -->
		<div class="sidebar-right">
			<div class="reserve-header">
				<div class="reserve-title">
					<svg
						width="18"
						height="18"
						viewBox="0 0 24 24"
						fill="none"
						stroke="#28a745"
						stroke-width="2"
					>
						<path
							d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
						></path>
						<polyline points="17 21 17 13 7 13 7 21"></polyline>
						<polyline points="7 3 7 8 15 8"></polyline>
					</svg>
					대기 과목 (장바구니)
				</div>
				<div class="reserve-desc">
					과목을 여기에 드래그 앤 드롭하여 매진 시 대비 예비 목록으로 저장하세요.
				</div>
			</div>

			<div
				class="reserve-zone"
				id="reserve-zone"
			>
				<!-- 대기 과목이 놓이는 영역 -->
			</div>
		</div>
	</div>

	<div class="modal-overlay hidden" id="course-modal-overlay">
		<div class="course-modal" role="dialog" aria-modal="true" aria-labelledby="course-modal-title">
			<button class="close-modal-btn" id="close-course-modal" aria-label="Đóng">×</button>
			<div class="course-modal-headline" id="course-modal-title">강의 정보</div>
			<div class="course-modal-grid">
				<div class="course-modal-row">
					<strong>학수번호:</strong>
					<span id="modal-course-code"></span>
				</div>
				<div class="course-modal-row">
					<strong>이수구분:</strong>
					<span id="modal-course-classification"></span>
				</div>
				<div class="course-modal-row">
					<strong>과목명:</strong>
					<span id="modal-course-name"></span>
				</div>
				<div class="course-modal-row">
					<strong>학점:</strong>
					<span id="modal-course-credits"></span>
				</div>
				<div class="course-modal-row">
					<strong>학년:</strong>
					<span id="modal-course-years"></span>
				</div>
				<div class="course-modal-row">
					<strong>강의실:</strong>
					<span id="modal-course-room"></span>
				</div>
				<div class="course-modal-row">
					<strong>인원:</strong>
					<span id="modal-course-enrollment"></span>
				</div>
				<div class="course-modal-row">
					<strong>교수:</strong>
					<div id="modal-course-professors" class="course-modal-list"></div>
				</div>
				<div class="course-modal-row">
					<strong>전공:</strong>
					<div id="modal-course-majors" class="course-modal-list"></div>
				</div>
			</div>
			<div class="course-modal-body" id="modal-course-description"></div>
			<button class="modal-action-btn" id="modal-syllabus-btn" type="button">강의계획서 보기</button>
		</div>
	</div>

	<!-- Professor modal -->
	<div class="modal-overlay hidden" id="prof-modal-overlay">
		<div class="course-modal professor-modal" role="dialog" aria-modal="true" aria-labelledby="prof-modal-title">
			<button class="close-modal-btn" id="close-prof-modal" aria-label="Đóng">×</button>
			<div class="course-modal-headline" id="prof-modal-title">교수 소개</div>
			<div class="prof-main">
				<div class="prof-top">
					<img id="prof-photo" src="" alt="교수 사진" />
					<div class="prof-basic">
						<div id="prof-name" class="prof-name"></div>
						<div id="prof-title" class="prof-title"></div>
						<div id="prof-dept" class="prof-dept"></div>
						<div id="prof-lab" class="prof-lab"></div>
						<div id="prof-contact" class="prof-contact"></div>
						<div id="prof-email" class="prof-email"></div>
						<div id="prof-research-areas" class="prof-research"></div>
					</div>
				</div>
				<div class="prof-bottom">
					<div class="prof-tabs" id="prof-tabs">
						<button class="prof-tab-btn active" data-tab="experience">경험</button>
						<button class="prof-tab-btn" data-tab="projects">프로젝트</button>
						<button class="prof-tab-btn" data-tab="patents">특허</button>
						<button class="prof-tab-btn" data-tab="books">서적</button>
						<button class="prof-tab-btn" data-tab="awards">상</button>
						<button class="prof-tab-btn" data-tab="degrees">학위</button>
						<button class="prof-tab-btn" data-tab="theses">논문</button>
						<button class="prof-tab-btn" data-tab="courses">강의</button>
						<button class="prof-tab-btn" data-tab="reviews">강의 평가</button>
					</div>
					<div class="prof-tab-content" id="prof-tab-content"></div>
				</div>
			</div>
		</div>
	</div>

	<script src="script.js"></script>
	</body>
</html>
